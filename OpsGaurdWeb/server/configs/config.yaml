# OpsGaurdWeb 管理端配置示例
# 复制为 config.local.yaml 使用

server:
  addr: ":8090"
  api_key: ""                # 网关鉴权 key，空则不启用
  ingest_token: ""           # Worker webhook 推送校验 token（配到 Worker agent-config.webhooks）

# 认证（P6）：本地用户 + SSO/OIDC。配置了 token_secret 或 sso 即启用认证中间件
#（健康检查 / webhook ingest / 登录 / SSO 跳转与回调 放行）；都不配 = 内网 bootstrap 不启用。
auth:
  token_secret: ""           # 本地 token 签名密钥（生产经环境变量注入，如 $OPSGUARD_TOKEN_SECRET）
  token_ttl: "24h"
  # sso:                      # 企业 SSO（OIDC，授权码流程）
  #   oidc:
  #     issuer: "https://sso.example.com"          # OIDC discovery 地址（.well-known/openid-configuration）
  #     client_id: "opsguard"
  #     client_secret: ""
  #     redirect_url: "http://localhost:8090/api/v1/auth/callback"
  #     frontend_url: "http://localhost:8090/#sso/callback"   # 回调成功后落地页（token 放 hash）
  #     scopes: []                                    # 默认 profile email（openid 恒包含）
  #     default_role: "viewer"                        # 新 SSO 用户默认角色（首个用户自动 admin）

# 持久化：LevelDB 数据目录（嵌入式 KV，拷贝目录即备份）
store:
  path: "./data"

# AiNexus 异常排查网关（内嵌进后端，非独立服务）
# providers/tools/MCP 客户端/ReAct Agent 与管理端同进程，原生端点挂载 /ainexus/*
# 注意：本块仅在首次启动时生效。在「系统设置 → AI 排查网关」页面保存过后，
# 以页面保存的运行时配置为准（LevelDB 持久化，保存即热重载，无需重启）。
ainexus:
  enabled: true              # false 则完全不加载网关（/ainexus/* 返回 503）
  providers:
    - name: "deepseek"
      type: "openai_compatible"   # openai_compatible | anthropic_compatible
      base_url: "https://api.deepseek.com/v1"
      api_key: ""
      models:
        - { name: "deepseek-chat", display_name: "DeepSeek Chat" }
        - { name: "deepseek-reasoner", display_name: "DeepSeek Reasoner" }
  tools:
    command:
      enabled: false         # 内嵌网关自身的命令执行工具（建议关闭，改用 Worker 的受控 exec）
      allowed_commands: []
      timeout: 30s
      work_dir: "/tmp"
    http_request:
      enabled: true
      timeout: 15s
    file_read:
      enabled: true
      max_size: 1048576
  agent:
    max_tool_rounds: 200           # 工具调用轮次上限（1M 上下文 + 摘要压缩兜底，长排查给足）
    parallel_tool_calls: true
    max_context_tokens: 800000    # 对齐深度排查模型 1M 窗口；超预算时摘要压缩旧轮次（类 Trae Memory），非硬删
    keep_tool_rounds: 5           # 压缩时完整保留最近多少个工具轮次（更早的走摘要）
  # MCP 客户端：连接各集群 Worker 的 /mcp（streamable-http），AI 排查时采集证据
  # 每个集群一条，transport=streamable-http，url 指向该集群 Worker
  mcp_servers:
    # - name: "dev-cluster"
    #   transport: "streamable-http"
    #   url: "http://<管理节点IP>:8080/mcp"
    #   headers:
    #     Authorization: "Bearer <worker-token>"

# 纳管的集群：name -> Worker 端点
# 每个集群由部署在 swarm manager 上的 Worker 提供编排/监控/MCP 能力
clusters:
  # dev-cluster:
  #   name: "dev-cluster"
  #   worker_url: "http://<管理节点IP>:8080"
  #   mcp_url: "http://<管理节点IP>:8080/mcp"
  #   token: ""
  #   desc: "开发集群"
