# OpsGaurdWeb 管理端配置示例
# 复制为 config.local.yaml 使用

server:
  addr: ":8090"
  api_key: ""                # 网关鉴权 key，空则不启用
  ingest_token: ""           # Worker webhook 推送校验 token（配到 Worker agent-config.webhooks）

# 认证（P6）：本地用户 + SSO/OIDC。配置了 token_secret 或 sso 即启用认证中间件
#（健康检查 / webhook ingest / 登录 / SSO 跳转与回调 放行）；都不配 = 内网 bootstrap 不启用。
auth:
  token_secret: ""           # 本地 token 签名密钥（生产经环境变量注入，如 $OPSGUARD_TOKEN_SECRET）
  token_ttl: "24h"
  # sso:                      # 企业 SSO（OIDC，授权码流程）
  #   oidc:
  #     issuer: "https://sso.example.com"          # OIDC discovery 地址（.well-known/openid-configuration）
  #     client_id: "opsguard"
  #     client_secret: ""
  #     redirect_url: "http://localhost:8090/api/v1/auth/callback"
  #     frontend_url: "http://localhost:8090/#sso/callback"   # 回调成功后落地页（token 放 hash）
  #     scopes: []                                    # 默认 profile email（openid 恒包含）
  #     default_role: "viewer"                        # 新 SSO 用户默认角色（首个用户自动 admin）

# IdP（OpsGaurd 自身作为 OIDC 身份提供者）：其他系统（企业内业务应用、Worker/MCP 工具）
# 可跳转 /api/v1/idp/authorize 到本系统完成认证。启用后自动开启认证中间件并播种 admin。
# 工作流：管理员在「系统设置 → 身份提供者」注册 client（redirect_uri/secret/PKCE）→
# 对接方按 OIDC 授权码+PKCE 流接入（discovery: /.well-known/openid-configuration）。
# idp:
#   enabled: true
#   issuer: "https://opsguard.example.com"     # 对外可达地址，生产须 https（localhost 例外便于开发）
#   access_token_ttl: "1h"                      # access token 有效期，默认 1h
#   refresh_token_ttl: "720h"                   # refresh token 有效期，默认 30 天

# 持久化：LevelDB 数据目录（嵌入式 KV，拷贝目录即备份）
store:
  path: "./data"

# 内嵌镜像仓库（OCI /v2）+ 页面传包构建（docker CLI）
# 与管理台同端口同进程；镜像引用统一用 hostname（双网段 hosts 解析到各自
# 网段的管理端地址，避免"外推内拉"割裂）。
registry:
  enabled: false             # 开启后 /v2 提供 docker push/pull,/api/v1/registry/* 提供页面管理
  hostname: "registry.opsguard"   # 统一寻址主机名；节点 daemon.json 的 insecure-registries 配它
  storage: ""                # 默认 <store.path>/registry
  retention_per_repo: 10     # 每仓库保留最近 N 个 tag（0 = 不裁剪；裁剪后自动清无引用 blob）
  max_upload_mb: 500         # 构建 zip 上传上限
  # users:                   # /v2 basic auth（节点 pull / 外部 push 都要过；空 = 不启用）
  #   ops: "$2y$10$..."      # bcrypt(htpasswd -B)或 {PLAIN}xxx
  # builder:                 # 管理端构建后 push 本机 registry 的账号(启动时 docker login)
  #   username: "builder"
  #   password: ""
  # 集群节点一次性配置（内网纯 HTTP 必须）：
  #   /etc/docker/daemon.json → { "insecure-registries": ["registry.opsguard:8090"] }
  #   /etc/hosts            → <管理端本网段IP> registry.opsguard

# AiNexus 异常排查网关（内嵌进后端，非独立服务）
# providers/tools/MCP 客户端/ReAct Agent 与管理端同进程，原生端点挂载 /ainexus/*
# 注意：本块仅在首次启动时生效。在「系统设置 → AI 排查网关」页面保存过后，
# 以页面保存的运行时配置为准（LevelDB 持久化，保存即热重载，无需重启）。
ainexus:
  enabled: true              # false 则完全不加载网关（/ainexus/* 返回 503）
  providers:
    - name: "deepseek"
      type: "openai_compatible"   # openai_compatible | anthropic_compatible
      base_url: "https://api.deepseek.com/v1"
      api_key: ""
      models:
        - { name: "deepseek-chat", display_name: "DeepSeek Chat" }
        - { name: "deepseek-reasoner", display_name: "DeepSeek Reasoner" }
  tools:
    command:
      enabled: false         # 内嵌网关自身的命令执行工具（建议关闭，改用 Worker 的受控 exec）
      allowed_commands: []
      timeout: 30s
      work_dir: "/tmp"
    http_request:
      enabled: true
      timeout: 15s
    file_read:
      enabled: true
      max_size: 1048576
  agent:
    max_tool_rounds: 200           # 工具调用轮次上限（1M 上下文 + 摘要压缩兜底，长排查给足）
    parallel_tool_calls: true
    max_context_tokens: 800000    # 对齐深度排查模型 1M 窗口；超预算时摘要压缩旧轮次（类 Trae Memory），非硬删
    keep_tool_rounds: 5           # 压缩时完整保留最近多少个工具轮次（更早的走摘要）
  # MCP 客户端：连接各集群 Worker 的 /mcp（streamable-http），AI 排查时采集证据
  # 每个集群一条，transport=streamable-http，url 指向该集群 Worker
  mcp_servers:
    # - name: "dev-cluster"
    #   transport: "streamable-http"
    #   url: "http://<管理节点IP>:8080/mcp"
    #   headers:
    #     Authorization: "Bearer <worker-token>"

# MLOps 运营层（提示词/模型/费用管理，围绕内嵌 AiNexus 网关）
# enabled=false：/api/v1/mlops/* 不注册路由，网关提示词走代码内置默认，
# 也不挂载用量计量（不产生 mlusage 明细）。
# 启用后可在「MLOps」页面管理提示词（版本/预览/回滚）与查看用量费用。
mlops:
  enabled: false
  # usage_retain_days: 90        # 用量明细保留天数（默认 90；日聚合不受 GC 影响）
  # timezone: Asia/Shanghai      # 业务时区（今日/本月口径；默认本机时区）
  # usage_queue_size: 2048       # 计量异步队列容量（满则丢弃计数，不阻塞响应）
  # usage_gc_interval: 24h       # 明细周期 GC 间隔（启动时先清理一次）
  # currency: CNY                # 费用币种（当前仅支持 CNY）

# 纳管的集群：name -> Worker 端点
# 每个集群由部署在 swarm manager 上的 Worker 提供编排/监控/MCP 能力
clusters:
  # dev-cluster:
  #   name: "dev-cluster"
  #   worker_url: "http://<管理节点IP>:8080"
  #   mcp_url: "http://<管理节点IP>:8080/mcp"
  #   token: ""
  #   desc: "开发集群"
