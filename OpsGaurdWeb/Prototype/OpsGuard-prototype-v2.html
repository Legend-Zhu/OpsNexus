const dt=c=>'<span class="dot dot-'+c+'"></span>';

function closeModal(){document.getElementById('modal-root').innerHTML=''}
function formField(label,name,val,type,opts){if(type==='select'){let o='<select class="fi" name="'+name+'">';(opts||[]).forEach(v=>o+='<option'+(v===val?' selected':'')+'>'+v+'</option>');return o+'</select>'}return '<input class="fi" name="'+name+'" value="'+(val||'')+'" type="'+(type||'text')+'">'}
function statusT(s){return s==='running'?tg('s','运行中'):s==='error'?tg('e','异常'):s==='stopped'?tg('i','已停止'):s==='active'?tg('e','活跃'):s==='recovered'?tg('s','已恢复'):tg('i',s)}
function sDot(s){return s==='online'?dt('ok')+'在线':s==='warning'?dt('wn')+'告警':dt('off')+'离线'}
function levelT(l){return l==='critical'?tg('e','严重'):l==='warning'?tg('w','警告'):tg('i','信息')}

    <div style="padding:4px 0">❌ <b>Java 未安装</b> — Agent 需要 Java 17+ → 先安装 JDK</div>
    <div style="padding:4px 0">❌ <b>端口冲突</b> — Agent 默认占用 9100 端口 → 修改 agent.yml 中的 port</div>
    <div style="padding:4px 0">❌ <b>权限不足</b> — 需要 root 或 sudo 权限执行安装脚本</div>
  </div>

  <div class="mf">
    <button class="btn btn-p" onclick="simulateAgentInstall(${sid||0})">🔄 模拟安装（演示）</button>
    <button class="btn btn-g" onclick="closeModal()">关闭</button>
  </div>`,1);
}

function simulateAgentInstall(sid){
  closeModal();
  toast('Agent 安装中，请稍候...');
  if(sid){
    const s=getS(sid);
    if(s){s.agent=true;s.status=s.status==='offline'?'online':s.status}
  }
  setTimeout(()=>{toast('✅ Agent 安装成功！服务器已纳入监控');render()},2000);
}

// ===== INIT =====
if(!isLoggedIn){renderLogin()}else{render()};
</script>
</body>
</html>
