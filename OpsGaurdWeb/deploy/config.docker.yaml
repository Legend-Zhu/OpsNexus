# OpsGaurdWeb 管理端生产配置（离线单机部署，10.60.189.6）
# 页面/API 监听 8080；Worker 在同机 8090，避免端口冲突。

server:
  addr: ":8080"
  api_key: ""                # 网关鉴权 key，空则不启用
  ingest_token: ""           # Worker webhook 推送校验 token（内网暂空）

# 认证：已启用本地账号登录（admin / opsguard-admin，首登后请立即修改）
auth:
  token_secret: "d46ab1ef0b62f3f33577b67c641da4f4af1a117d11201516"
  token_ttl: "24h"

# IdP（OpsGaurd 作为 OIDC 身份提供者）：启用后其他系统（r-nacos 控制台等）
# 可经 OpsGaurd 账号单点登录。issuer 填对外可达地址——政务外网用户经此访问。
# 配合 Worker 的 OPSGUARD_TUNNEL_BASE / OPSGUARD_IDP_PUBLIC_ISSUER，隔离网段集群
# 可经 gRPC 隧道访问 IdP，无需开反向防火墙。详见 docs/IdP-接入指南.md。
# idp:
#   enabled: true
#   issuer: "http://172.28.50.176:8080"   # 政务外网映射地址（authorize 浏览器跳转用）
#   access_token_ttl: "1h"
#   refresh_token_ttl: "720h"

# 持久化：LevelDB 数据目录（容器内 /app/data，挂载宿主 /opt/opsguard/server/data）
store:
  path: "./data"

# 内嵌镜像仓库（OCI /v2）+ 页面传包构建（docker CLI 走挂载的宿主 docker.sock）
registry:
  enabled: true
  hostname: "10.60.189.6"    # 单节点直接用管理机 IP；宿主 daemon.json 已配 insecure-registries
  storage: ""                # 默认 <store.path>/registry（随数据卷持久化）
  retention_per_repo: 10
  max_upload_mb: 500
  # users:                   # /v2 basic auth（内网暂空；开外网访问前务必配置）
  #   ops: "{PLAIN}change-me"

# AiNexus 异常排查网关：先在「系统设置 → AI 排查网关」页面配模型 API key 后启用
ainexus:
  enabled: false
  providers:
    - name: "deepseek"
      type: "openai_compatible"
      base_url: "https://api.deepseek.com/v1"
      api_key: ""
      models:
        - { name: "deepseek-chat", display_name: "DeepSeek Chat" }
        - { name: "deepseek-reasoner", display_name: "DeepSeek Reasoner" }
  tools:
    command:
      enabled: false
      allowed_commands: []
      timeout: 30s
      work_dir: "/tmp"
    http_request:
      enabled: true
      timeout: 15s
    file_read:
      enabled: true
      max_size: 1048576
  agent:
    max_tool_rounds: 200
    parallel_tool_calls: true
    max_context_tokens: 800000
    keep_tool_rounds: 5
  mcp_servers: []

# 智能巡检：cron 调度时区（IANA 名称）。默认 Asia/Shanghai——
# 0 9 * * * 即北京时间 9 点，不随容器时区漂移。
patrol:
  timezone: "Asia/Shanghai"

# 管理端 MCP Server（外部 AI 助手经 /mcp 用自然语言操作平台）。
# 接入示例/工具清单/FAQ 见 docs/管理端MCP-使用手册.md。
# mcp:
#   enabled: true
#   max_investigations: 4        # 委托内嵌 AI 排查的并发上限
#   exec_enabled: false          # exec 透传开关（默认关；开启后仍要求 scope=exec）
#   cluster_url_allow_cidrs: []  # worker_url/worker_http_url 白名单网段（空=不限制）
#   tokens:
#     - name: zcode              # secret 用 openssl rand -hex 32 生成
#       secret: "<32字节hex>"
#       scope: write
#     - name: viewer
#       secret: "<32字节hex>"
#       scope: read
