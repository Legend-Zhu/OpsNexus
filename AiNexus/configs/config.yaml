tools:
  command:
    enabled: true
    allowed_commands: []              # 空=允许所有，非空=白名单
    timeout: 30s
    work_dir: "/tmp"
  http_request:
    enabled: true
    timeout: 15s
  file_read:
    enabled: true
    max_size: 1048576                 # 1MB

mcp_servers: []
  # - name: "filesystem"
  #   transport: "stdio"
  #   command: "npx"
  #   args: ["-y", "@modelcontextprotocol/server-filesystem", "/tmp"]

agent:
  max_tool_rounds: 10
  parallel_tool_calls: true
