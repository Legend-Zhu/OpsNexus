# LLM 反向代理（182.57 nginx）。网闸任务 1731：10.60.114.2:50376 → 本机 7070。
# 设计：**单端口按路径前缀路由**——所有模型上游共用 7070，新加一个模型源
# = 加一个 location 块 + reload，不再新开端口/网闸任务：
#   /qwen/*  → http://111.228.46.187:63001/*   （Qwen vLLM，明文 HTTP）
#   其余路径  → https://82.156.119.58:5002/*    （主 LLM 网关，自签证书）
# 管理端 provider base_url 对应填：
#   主网关  http://10.60.114.2:50376/v1
#   Qwen   http://10.60.114.2:50376/qwen/v1
# 放置：/usr/local/nginx/conf/conf.d/opsguard-llm.conf，
#       /usr/local/nginx/sbin/nginx -t && /usr/local/nginx/sbin/nginx -s reload。
# （网闸任务 1732 / 50377 → 7071 已开通但按此设计暂不使用，保留备用。）

server {
    listen 10.50.182.57:7070;

    # 长上下文 chat 请求体可能远超 nginx 默认 1m，放开避免 413
    client_max_body_size 64m;

    # --- Qwen 模型源：/qwen/* → 上游根路径（去掉 /qwen 前缀）---
    location /qwen/ {
        proxy_pass http://111.228.46.187:63001/;

        proxy_http_version 1.1;
        proxy_set_header Host $proxy_host;
        # Authorization 头默认透传，模型 key 不落任何配置文件。

        # SSE 逐字流式必须关缓冲，否则对话退化为“卡住后一次性吐完”
        proxy_buffering off;
        proxy_request_buffering off;

        proxy_connect_timeout 15s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;              # 长对话/慢模型，别用默认 60s
        proxy_next_upstream off;              # 上游报错直接返回，不重试请求
    }

    # --- 默认：主 LLM 网关（多模型，路径透传）---
    location / {
        proxy_pass https://82.156.119.58:5002;
        proxy_ssl_verify off;                 # 上游自签证书

        proxy_http_version 1.1;
        proxy_set_header Host $proxy_host;
        proxy_buffering off;
        proxy_request_buffering off;

        proxy_connect_timeout 15s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        proxy_next_upstream off;
    }
}
