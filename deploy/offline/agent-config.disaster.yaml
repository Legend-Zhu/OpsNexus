# OpsGaurd Worker 生产配置 —— 自然灾害集群（5 节点，manager=10.60.171.232）
# 安装位置：/etc/opsguard/agent-config.yaml（stack 挂载进容器）

worker:
  role: auto                 # 232 自动识别为 manager（编排+MCP），其余为 node
  listen: ":6060"            # HTTP（/mcp+/healthz+local API）；实际监听由 -addr 旗标设定
  grpcListen: ":6061"        # gRPC 管理 API；server 连 232:6061 拉事件流
  dataDir: "/var/lib/opsguard"  # 持久化状态（事件/审计队列），stack 已挂卷

# 已废弃：事件现经 gRPC SubscribeEvents 流回推（server 主动连 232:6061）。
# 171.x 与 189.6 网段隔离下，server 需能单向访问 232:6061（路由/NAT 映射）。
# webhooks:
#   - "http://10.60.189.6:8080/api/v1/ingest/events"

# Bearer-token 鉴权：生产环境必须开启——不配则 gRPC/HTTP/MCP 端口裸奔。
# server 集群注册时需填同样的 token 才能访问 Worker。
auth:
  enabled: true
  tokens:
    opsguard-server: "f6f44ba6a6a6142d94327754bd930274b00c9aed0578ee48"

commandPolicy:
  mode: blacklist
  allowHostExec: false       # 生产 K8s 节点：宿主机命令执行保持关闭
  allowContainerExec: true
  timeout: 30s
  blacklist:
    - "curl http://|sh"
    - "wget http://|sh"
