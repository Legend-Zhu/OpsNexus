# OpsGaurd Worker —— 自然灾害集群（5 节点 swarm，manager=10.60.171.232）。
# Worker HTTP 端口 6060、gRPC 端口 6061（管理端集群配置指向 232 的 gRPC 6061）。
#
# 双端口职责（gRPC 重构后）：
#   :6060 HTTP — /mcp + /healthz + 节点级 local API
#   :6061 gRPC — 管理 API，server 连 232:6061 拉 SubscribeEvents 事件流
#
# 注意：这些节点同时运行 RKE K8s（canal/flannel 用 UDP 8472）；
# swarm overlay 用 UDP 4789，已确认空闲，互不冲突。
# swarm 会静默忽略 privileged/pid: host（见 README「限制」一节）。
#
# 前置：5 节点均已 docker load opsguard-worker:1.0.1；/etc/opsguard/agent-config.yaml 就位。
# 部署（在 232 上）：docker stack deploy -c stack.disaster.yml opsguard

version: "3.8"

services:
  worker:
    image: opsguard-worker:1.0.2
    hostname: "{{.Node.Hostname}}"
    # swarm 忽略以下两项（保留作普通容器形态的权限说明）
    privileged: true
    pid: host
    deploy:
      mode: global
      restart_policy:
        condition: any
        delay: 5s
        max_attempts: 3
      resources:
        limits:
          memory: 256M
    environment:
      - DOCKER_HOST=unix:///var/run/docker.sock
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /etc/opsguard/agent-config.yaml:/etc/opsguard/agent-config.yaml:ro
      # 持久化状态（事件/审计 SQLite 队列），重启不丢事件。
      - /var/lib/opsguard:/var/lib/opsguard
    command: ["-agent-config", "/etc/opsguard/agent-config.yaml", "-addr", ":6060", "-grpc-addr", ":6061"]
    # mode: host —— 直连发布，不过 ingress 负载均衡：多节点下管理端请求
    # 232:6060 必须恒落到 232 本机的 manager 任务（ingress 会轮转到 node 任务
    # 导致编排 API 404）；节点 worker 的本机 API 同样经各自 IP:6060 访问。
    # gRPC 6061 同理：server 连 232:6061 必须落到 232 本机 manager。
    ports:
      - mode: host
        published: 6060
        target: 6060
      - mode: host
        published: 6061
        target: 6061
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
