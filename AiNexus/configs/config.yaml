server:
  addr: ":8080"
  api_key: ""                        # 网关鉴权 key，为空则不鉴权

# ============================================================
# 提供商配置
# type 取值：
#   openai_compatible   — 兼容 OpenAI Chat Completion API 格式
#                         适用于：OpenAI、GLM、DeepSeek、Moonshot、Ollama、vLLM 等
#   anthropic_compatible — 兼容 Anthropic Messages API 格式
#                         适用于：Anthropic Claude 等
#
# 每个提供商下可配置多个模型，模型名称全局唯一
# ============================================================
providers:
  # DeepSeek
  - name: "deepseek"
    type: "openai_compatible"
    base_url: "https://api.deepseek.com/v1"
    api_key: "sk-3e5465596b3448e6aa81b002856965a3"
    models:
      - name: "deepseek-v4-flash"
        display_name: "DeepSeek V4 Flash"
        max_tokens: 8192

  # ── 下面是示例，按需启用 ──

  # 智谱 GLM
