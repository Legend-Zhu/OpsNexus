# Deploy the OpsGaurd Worker to every node of a Docker Swarm (global service).
#
# Each node runs a Worker:
#   - manager nodes: orchestration API + MCP + per-node local API
#   - worker nodes:  per-node local API (stats / container exec / host exec)
# The manager aggregates/proxies cross-node calls to the node workers.
#
# LIMITATION: swarm services silently IGNORE `privileged` and `pid: host`
# (deploy logs "Ignoring unsupported options"). Under swarm the Worker therefore
# sees only its own PID namespace — host process listing, host-wide stats and
# exec_host_command (nsenter) are unavailable. If full host visibility is
# required, run the Worker as a plain container instead:
#   docker run -d --privileged --pid host --network host \
#     -v /var/run/docker.sock:/var/run/docker.sock:ro \
#     -v /etc/opsguard/agent-config.yaml:/etc/opsguard/agent-config.yaml:ro \
#     opsguard-worker:1.0.0 -agent-config /etc/opsguard/agent-config.yaml
#
# Deploy:
#   docker build -t opsguard-worker:1.0.0 -f Dockerfile .
#   docker stack deploy -c stack.yml opsguard
# Required: swarm initialized; agent-config mounted on every node.

version: "3.8"

services:
  worker:
    image: opsguard-worker:1.0.0
    hostname: "{{.Node.Hostname}}"
    # NOTE: swarm ignores both options below (kept for documentation of the
    # required privileges when running as a plain container — see header).
    privileged: true
    pid: host
    deploy:
      mode: global
      restart_policy:
        condition: any
        delay: 5s
        max_attempts: 3
      resources:
        limits:
          memory: 256M
    environment:
      - DOCKER_HOST=unix:///var/run/docker.sock
    # Every worker listens on the same port; the manager proxies to node
    # workers on this port via the node's swarm address. The proxy port is
    # derived from the -addr flag (default :8080), not an env var.
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # Agent config (command policy / role). Mount the same file on all
      # nodes; the sample in deploy/agent-config.yaml.example is safe-by-default.
      - /etc/opsguard/agent-config.yaml:/etc/opsguard/agent-config.yaml:ro
      # Persistent state (event/audit SQLite queues). Manager-role workers
      # own these; node-role workers ignore the volume. Survives restarts so
      # the gRPC Subscribe* streams resume without event loss.
      - /var/lib/opsguard:/var/lib/opsguard
    command: ["-agent-config", "/etc/opsguard/agent-config.yaml"]
    ports:
      # HTTP: /mcp (Streamable HTTP), /healthz, node-level local API.
      - "8080:8080"
      # gRPC: management API (server↔worker). The server connects here and
      # opens SubscribeEvents/SubscribeAudit streams to pull events back over
      # the one-way-allowed direction (server → worker).
      - "9080:9080"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
