<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AiNexus Chat</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #0f0f0f;
    color: #e0e0e0;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* 顶部栏 */
  .topbar {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 12px 24px;
    background: #1a1a1a;
    border-bottom: 1px solid #2a2a2a;
    flex-shrink: 0;
  }
  .topbar h1 {
    font-size: 18px;
    font-weight: 600;
    color: #8ab4f8;
  }
  .topbar .status {
    font-size: 12px;
    color: #666;
    margin-left: auto;
  }
  .topbar .status.ok { color: #4caf50; }
  .topbar .status.err { color: #f44336; }

  /* 模型选择 + 设置行 */
  .settings-row {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 24px;
    background: #141414;
    border-bottom: 1px solid #222;
    flex-shrink: 0;
    flex-wrap: wrap;
  }
  .settings-row label {
    font-size: 13px;
    color: #999;
  }
  .settings-row select, .settings-row input {
    background: #1e1e1e;
    color: #e0e0e0;
    border: 1px solid #333;
    border-radius: 6px;
    padding: 6px 10px;
    font-size: 13px;
    outline: none;
  }
  .settings-row select:focus, .settings-row input:focus {
    border-color: #8ab4f8;
  }
  .settings-row input[type="text"] {
    width: 280px;
  }
  .settings-row input[type="number"] {
    width: 80px;
  }
  #modelSelect { min-width: 200px; }

  /* 对话区 */
  .chat-area {
    flex: 1;
    overflow-y: auto;
    padding: 24px;
    scroll-behavior: smooth;
  }
  .chat-area::-webkit-scrollbar { width: 6px; }
  .chat-area::-webkit-scrollbar-thumb { background: #333; border-radius: 3px; }

  /* 消息气泡 */
  .msg {
    max-width: 720px;
    margin: 0 auto 16px;
    display: flex;
    gap: 12px;
    animation: fadeIn 0.2s ease;
  }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

  .msg .avatar {
    width: 32px; height: 32px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 14px; flex-shrink: 0;
  }
  .msg.user .avatar { background: #8ab4f8; color: #000; }
  .msg.assistant .avatar { background: #4caf50; color: #000; }
  .msg.system .avatar { background: #ff9800; color: #000; }
  .msg.error .avatar { background: #f44336; color: #fff; }

  .msg .bubble {
    background: #1e1e1e;
    border-radius: 12px;
    padding: 12px 16px;
    font-size: 14px;
    line-height: 1.7;
    white-space: pre-wrap;
    word-break: break-word;
    flex: 1;
    min-width: 0;
  }
  .msg.user .bubble { background: #1a2a3a; }
  .msg.assistant .bubble { background: #1e1e1e; }
  .msg.system .bubble { background: #2a2a1a; color: #ccc; font-style: italic; }
  .msg.error .bubble { background: #2a1a1a; color: #f88; }

  /* 工具调用展示 */
  .tool-call {
    margin: 8px 0;
    padding: 8px 12px;
    background: #1a1a2a;
    border-left: 3px solid #8ab4f8;
    border-radius: 4px;
    font-size: 12px;
    color: #8ab4f8;
  }
  .tool-call .tool-name { font-weight: 600; }
  .tool-call .tool-result {
    margin-top: 6px;
    padding: 8px;
    background: #111;
    border-radius: 4px;
    color: #aaa;
    max-height: 200px;
    overflow-y: auto;
    white-space: pre-wrap;
    word-break: break-all;
  }

  /* 打字光标 */
  .typing-cursor::after {
    content: "▌";
    animation: blink 0.8s infinite;
    color: #8ab4f8;
  }
  @keyframes blink { 0%, 50% { opacity: 1; } 51%, 100% { opacity: 0; } }

  /* 输入区 */
  .input-area {
    padding: 16px 24px;
    background: #1a1a1a;
    border-top: 1px solid #2a2a2a;
    flex-shrink: 0;
  }
  .input-row {
    max-width: 768px;
    margin: 0 auto;
    display: flex;
    gap: 10px;
  }
  .input-row textarea {
    flex: 1;
    background: #1e1e1e;
    color: #e0e0e0;
    border: 1px solid #333;
    border-radius: 12px;
    padding: 12px 16px;
    font-size: 14px;
    font-family: inherit;
    resize: none;
    outline: none;
    max-height: 120px;
    line-height: 1.5;
  }
  .input-row textarea:focus { border-color: #8ab4f8; }
  .input-row button {
    background: #8ab4f8;
    color: #000;
    border: none;
    border-radius: 12px;
    padding: 12px 24px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.2s;
    white-space: nowrap;
  }
  .input-row button:hover { background: #a8c8ff; }
  .input-row button:disabled { background: #444; color: #666; cursor: not-allowed; }
  .input-row button.stop-btn { background: #f44336; color: #fff; }
  .input-row button.stop-btn:hover { background: #ff6666; }

  /* 空状态 */
  .empty-state {
    text-align: center;
    padding: 80px 20px;
    color: #555;
  }
  .empty-state .icon { font-size: 48px; margin-bottom: 16px; }
  .empty-state p { font-size: 14px; line-height: 1.8; }

  /* 响应式 */
  @media (max-width: 640px) {
    .settings-row { padding: 8px 12px; gap: 8px; }
    .chat-area { padding: 12px; }
    .input-area { padding: 8px 12px; }
    .settings-row input[type="text"] { width: 100%; }
  }
</style>
</head>
<body>

<div class="topbar">
  <h1>⚡ AiNexus Chat</h1>
  <span class="status" id="statusText">检测中...</span>
</div>

<div class="settings-row">
  <label>模型</label>
  <select id="modelSelect"><option value="">加载中...</option></select>

  <label>API 地址</label>
  <input type="text" id="apiBase" value="" placeholder="http://localhost:8080">

  <label>API Key</label>
  <input type="text" id="apiKey" value="" placeholder="网关鉴权 key（可选）">

  <label>MaxTokens</label>
  <input type="number" id="maxTokens" value="4096" min="1" max="128000">
</div>

<div class="chat-area" id="chatArea">
  <div class="empty-state">
    <div class="icon">🤖</div>
    <p>选择模型，输入问题开始对话<br>支持流式输出和工具调用</p>
  </div>
</div>

<div class="input-area">
  <div class="input-row">
    <textarea id="userInput" placeholder="输入消息，Enter 发送，Shift+Enter 换行..." rows="1"></textarea>
    <button id="sendBtn" onclick="sendMessage()">发送</button>
  </div>
</div>

<script>
// ========== 全局状态 ==========
const chatArea = document.getElementById('chatArea');
const modelSelect = document.getElementById('modelSelect');
const apiBaseInput = document.getElementById('apiBase');
const apiKeyInput = document.getElementById('apiKey');
const maxTokensInput = document.getElementById('maxTokens');
const sendBtn = document.getElementById('sendBtn');
const userInput = document.getElementById('userInput');
const statusText = document.getElementById('statusText');

let messages = [];       // 对话历史
let isStreaming = false;  // 是否正在流式输出
let abortController = null;

// ========== 初始化 ==========
function getApiBase() {
  return apiBaseInput.value.replace(/\/+$/, '') || window.location.origin;
}

async function init() {
  // 从 URL 参数读取 apiBase
  const urlParams = new URLSearchParams(window.location.search);
  if (urlParams.get('api')) apiBaseInput.value = urlParams.get('api');
  if (urlParams.get('key')) apiKeyInput.value = urlParams.get('key');

  await loadModels();
  await checkHealth();
}

// 加载模型列表
async function loadModels() {
  try {
    const base = getApiBase();
    const resp = await fetch(base + '/v1/models', { headers: getAuthHeaders() });
    if (!resp.ok) throw new Error('HTTP ' + resp.status);
    const data = await resp.json();

    modelSelect.innerHTML = '';
    if (data.data && data.data.length > 0) {
      data.data.forEach(m => {
        const opt = document.createElement('option');
        opt.value = m.id;
        opt.textContent = m.id + (m.owned_by ? ` (${m.owned_by})` : '');
        modelSelect.appendChild(opt);
      });
    } else {
      modelSelect.innerHTML = '<option value="">无可用模型</option>';
    }
  } catch (e) {
    modelSelect.innerHTML = '<option value="">加载失败</option>';
    console.error('Load models failed:', e);
  }
}

// 健康检查
async function checkHealth() {
  try {
    const base = getApiBase();
    const resp = await fetch(base + '/health');
    if (resp.ok) {
      const data = await resp.json();
      statusText.textContent = `✅ 在线 | ${data.models || 0} 模型 | ${data.tools || 0} 工具`;
      statusText.className = 'status ok';
    } else {
      throw new Error('HTTP ' + resp.status);
    }
  } catch (e) {
    statusText.textContent = '❌ 离线 — 请检查 API 地址和服务状态';
    statusText.className = 'status err';
  }
}

// 获取鉴权头
function getAuthHeaders() {
  const key = apiKeyInput.value.trim();
  const h = { 'Content-Type': 'application/json' };
  if (key) h['Authorization'] = 'Bearer ' + key;
  return h;
}

// ========== 消息渲染 ==========
function clearEmptyState() {
  const es = chatArea.querySelector('.empty-state');
  if (es) es.remove();
}

function appendMessage(role, content, extra) {
  clearEmptyState();
  const div = document.createElement('div');
  div.className = 'msg ' + role;

  const avatarText = role === 'user' ? '👤' : role === 'error' ? '⚠' : role === 'system' ? '🔧' : '🤖';
  div.innerHTML = `<div class="avatar">${avatarText}</div><div class="bubble"></div>`;

  const bubble = div.querySelector('.bubble');

  // 工具调用展示
  if (extra && extra.toolCalls && extra.toolCalls.length > 0) {
    extra.toolCalls.forEach(tc => {
      const toolDiv = document.createElement('div');
      toolDiv.className = 'tool-call';
      let html = `<span class="tool-name">🔧 ${tc.name}</span>`;
      if (tc.arguments) {
        try {
          html += `<div style="color:#777;margin-top:4px">参数: ${JSON.stringify(JSON.parse(tc.arguments), null, 2)}</div>`;
        } catch {
          html += `<div style="color:#777;margin-top:4px">参数: ${tc.arguments}</div>`;
        }
      }
      if (tc.result) {
        html += `<div class="tool-result">${escapeHtml(tc.result)}</div>`;
      }
      toolDiv.innerHTML = html;
      bubble.appendChild(toolDiv);
    });
  }

  // 文本内容（始终创建 span，即使内容为空）
  const textNode = document.createElement('span');
  textNode.className = 'text-content';
  textNode.textContent = content || '';
  bubble.appendChild(textNode);

  chatArea.appendChild(div);
  chatArea.scrollTop = chatArea.scrollHeight;
  return div;
}

// 更新助手消息（流式追加）
function updateAssistantBubble(div, content, isDone) {
  const bubble = div.querySelector('.bubble');
  const textSpan = bubble.querySelector('.text-content');
  if (textSpan) {
    textSpan.textContent = content;
    if (!isDone) {
      textSpan.className = 'text-content typing-cursor';
    } else {
      textSpan.className = 'text-content';
    }
  }
  chatArea.scrollTop = chatArea.scrollHeight;
}

function escapeHtml(str) {
  const d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML;
}

// 格式化工具名: mcp_db-mcp-test_query → [db-mcp-test] query
function formatToolName(name) {
  // 匹配 mcp_{server}_{tool} 格式
  const mcpMatch = name.match(/^mcp_(.+?)_(.+)$/);
  if (mcpMatch) {
    return `<span style="color:#888">[${mcpMatch[1]}]</span> ${mcpMatch[2]}`;
  }
  return name;
}

// 更新工具调用的状态和结果
function updateToolCallDiv(toolDiv, result, isError) {
  const statusSpan = toolDiv.querySelector('.tool-status');
  if (statusSpan) {
    if (isError) {
      statusSpan.innerHTML = '<span style="color:#f44336">❌ 失败</span>';
    } else {
      statusSpan.innerHTML = '<span style="color:#4caf50">✅ 完成</span>';
    }
  }
  // 追加结果展示
  if (result) {
    const existingResult = toolDiv.querySelector('.tool-result');
    if (!existingResult) {
      const resultDiv = document.createElement('div');
      resultDiv.className = 'tool-result';
      const truncated = result.length > 500 ? result.substring(0, 500) + '\n... (已截断)' : result;
      resultDiv.textContent = truncated;
      toolDiv.appendChild(resultDiv);
    }
  }
}

// ========== 发送消息 ==========
async function sendMessage() {
  if (isStreaming) {
    // 中止当前流
    if (abortController) abortController.abort();
    stopStreaming();
    return;
  }

  const text = userInput.value.trim();
  if (!text) return;

  const model = modelSelect.value;
  if (!model) { alert('请先选择模型'); return; }

  // 添加用户消息
  messages.push({ role: 'user', content: text });
  appendMessage('user', text);

  userInput.value = '';
  userInput.style.height = 'auto';
  startStreaming();

  // 创建助手消息气泡
  const assistantDiv = appendMessage('assistant', '');
  let fullContent = '';
  let toolCallsMap = {};

  try {
    abortController = new AbortController();

    const body = {
      model: model,
      messages: messages,
      stream: true,
      max_tokens: parseInt(maxTokensInput.value) || 4096,
    };

    const base = getApiBase();
    const resp = await fetch(base + '/v1/chat/completions', {
      method: 'POST',
      headers: getAuthHeaders(),
      body: JSON.stringify(body),
      signal: abortController.signal,
    });

    if (!resp.ok) {
      const errBody = await resp.text();
      let errMsg = `HTTP ${resp.status}`;
      try { errMsg = JSON.parse(errBody).error?.message || errMsg; } catch {}
      appendMessage('error', errMsg);
      messages.pop(); // 移除刚加的 user 消息
      stopStreaming();
      return;
    }

    // 解析 SSE 流
    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;

      buffer += decoder.decode(value, { stream: true });
      const lines = buffer.split('\n');
      buffer = lines.pop() || '';

      for (const line of lines) {
        if (!line.startsWith('data: ')) continue;
        const data = line.slice(6).trim();
        if (data === '[DONE]') continue;

        try {
          const chunk = JSON.parse(data);
          if (!chunk.choices || chunk.choices.length === 0) continue;
          const choice = chunk.choices[0];

          // 文本增量
          if (choice.delta && choice.delta.content) {
            fullContent += choice.delta.content;
            updateAssistantBubble(assistantDiv, fullContent, false);
          }

          // 工具调用
          if (choice.delta && choice.delta.tool_calls) {
            for (const tc of choice.delta.tool_calls) {
              const idx = tc.index;
              if (!toolCallsMap[idx]) {
                toolCallsMap[idx] = { id: tc.id || '', name: '', arguments: '' };
              }
              if (tc.function) {
                if (tc.function.name) toolCallsMap[idx].name = tc.function.name;
                if (tc.function.arguments) toolCallsMap[idx].arguments += tc.function.arguments;
              }
              // 工具结果：更新已渲染的工具调用卡片
              if (tc.tool_result) {
                toolCallsMap[idx].result = tc.tool_result.content;
                toolCallsMap[idx].isError = tc.tool_result.is_error;
                const toolDiv = assistantDiv.querySelector(`.tool-call[data-index="${idx}"]`);
                if (toolDiv) {
                  updateToolCallDiv(toolDiv, tc.tool_result.content, tc.tool_result.is_error);
                }
              }
            }
          }

          // 完成
          if (choice.finish_reason) {
            // 展示工具调用
            if (Object.keys(toolCallsMap).length > 0) {
              const bubble = assistantDiv.querySelector('.bubble');
              Object.entries(toolCallsMap).forEach(([idx, tc]) => {
                // 检查是否已经渲染过
                if (assistantDiv.querySelector(`.tool-call[data-index="${idx}"]`)) return;
                const toolDiv = document.createElement('div');
                toolDiv.className = 'tool-call';
                toolDiv.setAttribute('data-index', idx);
                let html = `<span class="tool-name">🔧 ${formatToolName(tc.name)}</span>`;
                html += `<div class="tool-status" style="color:#777;margin-top:4px;font-size:11px">调用中...</div>`;
                // 如果已有结果（可能已在 tool_result 中收到），立即展示
                if (tc.result !== undefined) {
                  updateToolCallDiv(toolDiv, tc.result, tc.isError);
                  // updateToolCallDiv 已经改了 innerHTML，需要重新构建
                  toolDiv.innerHTML = `<span class="tool-name">🔧 ${formatToolName(tc.name)}</span>`;
                  const statusSpan = document.createElement('div');
                  statusSpan.className = 'tool-status';
                  statusSpan.style.cssText = 'margin-top:4px;font-size:11px';
                  statusSpan.innerHTML = tc.isError ? '<span style="color:#f44336">❌ 失败</span>' : '<span style="color:#4caf50">✅ 完成</span>';
                  toolDiv.appendChild(statusSpan);
                  if (tc.result) {
                    const resultDiv = document.createElement('div');
                    resultDiv.className = 'tool-result';
                    resultDiv.textContent = tc.result.length > 500 ? tc.result.substring(0, 500) + '\n... (已截断)' : tc.result;
                    toolDiv.appendChild(resultDiv);
                  }
                } else {
                  toolDiv.innerHTML = html;
                }
                bubble.insertBefore(toolDiv, bubble.querySelector('.text-content'));
              });
            }
          }
        } catch (e) {
          // 忽略解析错误
        }
      }
    }

    // 流结束
    updateAssistantBubble(assistantDiv, fullContent, true);

    // 记录助手消息到历史
    const assistantMsg = { role: 'assistant', content: fullContent };
    const toolCallsArr = Object.values(toolCallsMap);
    if (toolCallsArr.length > 0) {
      assistantMsg.tool_calls = toolCallsArr.map(tc => ({
        id: tc.id,
        type: 'function',
        function: { name: tc.name, arguments: tc.arguments }
      }));
    }
    messages.push(assistantMsg);

  } catch (e) {
    if (e.name === 'AbortError') {
      updateAssistantBubble(assistantDiv, fullContent + '\n\n[已中止]', true);
    } else {
      appendMessage('error', '请求失败: ' + e.message);
    }
  } finally {
    stopStreaming();
  }
}

function startStreaming() {
  isStreaming = true;
  sendBtn.textContent = '停止';
  sendBtn.className = 'stop-btn';
  userInput.disabled = true;
}

function stopStreaming() {
  isStreaming = false;
  abortController = null;
  sendBtn.textContent = '发送';
  sendBtn.className = '';
  userInput.disabled = false;
  userInput.focus();
}

// ========== 事件绑定 ==========

// Enter 发送，Shift+Enter 换行
userInput.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
});

// 自适应高度
userInput.addEventListener('input', () => {
  userInput.style.height = 'auto';
  userInput.style.height = Math.min(userInput.scrollHeight, 120) + 'px';
});

// API 地址变化时重新加载模型
apiBaseInput.addEventListener('change', () => { loadModels(); checkHealth(); });

// 清空对话（双击标题）
document.querySelector('.topbar h1').addEventListener('dblclick', () => {
  if (confirm('清空对话历史？')) {
    messages = [];
    chatArea.innerHTML = '<div class="empty-state"><div class="icon">🤖</div><p>选择模型，输入问题开始对话</p></div>';
  }
});

// 启动
init();
</script>
</body>
</html>
